<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NVO987 — Markdown</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 860px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.6;
      color: #1f2328;
    }
    img { max-width: 100%; height: auto; }
    pre, code { background: #f6f8fa; padding: 0.2em 0.4em; border-radius: 4px; }
    blockquote { border-left: 4px solid #d0d7de; margin: 1rem 0; padding: 0 1rem; color: #57606a; }
    .top-bar { margin-bottom: 1.5rem; font-size: 0.9rem; display: flex; gap: 1rem; align-items: center; }
    button { padding: 0.35rem 0.75rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="https://raw.githubusercontent.com/nvo987-art-history/md/main/nvo987.md" target="_blank">Fichier brut (nvo987.md)</a>
    <button onclick="loadMd()">Actualiser</button>
  </div>
  <div id="content">Chargement...</div>

  <script>
    function loadMd() {
      const box = document.getElementById('content');
      box.innerHTML = 'Chargement...';
      const rawUrl = 'https://raw.githubusercontent.com/nvo987-art-history/md/main/nvo987.md?cb=' + Date.now();
      fetch(rawUrl, { cache: 'no-store' })
        .then(res => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.text();
        })
        .then(md => {
          box.innerHTML = marked.parse(md);
        })
        .catch(err => {
          box.innerHTML = '<p>Impossible de charger nvo987.md : <strong>' + err.message + '</strong></p>';
        });
    }
    loadMd();
  </script>
</body>
</html>
