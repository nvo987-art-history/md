<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NVO987 — Markdown</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1f2328;
      --muted: #57606a;
      --border: #d8dee4;
      --card: #f6f8fa;
      --accent: #0969da;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 860px;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
      line-height: 1.65;
      overflow-wrap: anywhere;
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      margin-bottom: 1.75rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .top-bar a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .top-bar a:hover { text-decoration: underline; }
    button {
      padding: 0.4rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #ffffff;
      color: var(--text);
      font-size: 0.875rem;
      cursor: pointer;
    }
    button:hover { background: #eef1f4; }
    h1 { font-size: 1.75rem; line-height: 1.25; margin-top: 0; }
    h2 { font-size: 1.35rem; margin-top: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.35rem; }
    h3 { font-size: 1.1rem; margin-top: 1.5rem; }
    img { max-width: 100%; height: auto; border-radius: 6px; }
    pre, code {
      background: var(--card);
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9em;
    }
    code { padding: 0.15em 0.35em; }
    pre { padding: 0.9rem; overflow-x: auto; border: 1px solid var(--border); }
    blockquote {
      border-left: 4px solid var(--border);
      margin: 1.25rem 0;
      padding: 0.25rem 1rem;
      color: var(--muted);
      background: #fafbfc;
      border-radius: 0 6px 6px 0;
    }
    a { color: var(--accent); }
    hr { border: 0; border-top: 1px solid var(--border); margin: 1.75rem 0; }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="https://raw.githubusercontent.com/nvo987-art-history/md/main/nvo987.md" target="_blank" rel="noopener">
      Fichier brut (nvo987.md)
    </a>
    <button type="button" onclick="loadMd()">Actualiser</button>
  </div>
  <div id="content">Chargement...</div>

  <script>
    function stripFrontmatter(mdText) {
      return mdText.replace(/^---\s*\r?\n[\s\S]*?\r?\n---\s*\r?\n?/, '');
    }

    function loadMd() {
      const box = document.getElementById('content');
      box.innerHTML = '<p>Chargement...</p>';
      const rawUrl = 'https://raw.githubusercontent.com/nvo987-art-history/md/main/nvo987.md?cb=' + Date.now();

      fetch(rawUrl, { cache: 'no-store' })
        .then(res => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.text();
        })
        .then(md => {
          const cleanMd = stripFrontmatter(md);
          box.innerHTML = marked.parse(cleanMd);
        })
        .catch(err => {
          box.innerHTML = '<p>Impossible de charger nvo987.md : <strong>' + err.message + '</strong></p>';
        });
    }

    loadMd();
  </script>
</body>
</html>
