<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NVO987 — Markdown</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 860px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.6;
      color: #1f2328;
    }
    img { max-width: 100%; height: auto; }
    pre, code { background: #f6f8fa; padding: 0.2em 0.4em; border-radius: 4px; }
    blockquote { border-left: 4px solid #d0d7de; margin: 1rem 0; padding: 0 1rem; color: #57606a; }
    .top-bar { margin-bottom: 1.5rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="./nvo987.md">Télécharger / Voir le fichier brut (nvo987.md)</a>
  </div>
  <div id="content">Chargement...</div>

  <script>
    const mdUrl = './nvo987.md?cb=' + Date.now() + '-' + Math.random().toString(36).slice(2);
    fetch(mdUrl, { cache: 'no-store' })
      .then(res => {
        if (!res.ok) throw new Error('HTTP ' + res.status + ' (' + res.statusText + ')');
        return res.text();
      })
      .then(md => {
        document.getElementById('content').innerHTML = marked.parse(md);
      })
      .catch(err => {
        document.getElementById('content').innerHTML =
          '<p>Impossible de charger nvo987.md : <strong>' + err.message + '</strong></p>';
      });
  </script>
</body>
</html>
